
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beeral - Menú Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles_v2.css">
</head>
<body>
  <div class="watermark"><span>RESTAURANT<br>GASTRONOMY<br>RECIPE</span></div>
  <div class="app-container">
    <div class="browser-bar">
      <div class="window-controls"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
      <div class="url-bar"><span class="lock">&#128274;</span><span>demo.beeral.com.mx</span><span id="source-badge" class="status-badge">N8N ONLINE</span></div>
    </div>
    <nav class="top-nav">
      <div class="nav-inner"><button class="tab-btn active" data-tab="menu">Menú</button><button class="tab-btn" data-tab="kitchen">Comandas</button></div>
    </nav>
    <main>
      <section id="menu-view" class="view active">
        <div class="hero-section">
          <div class="hero-badge">&#9733; Experiencia Gastronómica</div>
          <div class="hero-logo"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" stroke="#c4a882" fill="none" stroke-width="0.8"/><path d="M30 12Q35 20 38 28Q30 32 22 28Q25 20 30 12Z" fill="#c4a882"/><path d="M20 30Q30 24 40 30Q38 38 30 42Q22 38 20 30Z" fill="none" stroke="#c4a882" stroke-width="0.6"/><circle cx="30" cy="30" r="15" fill="none" stroke="#c4a882" stroke-width="0.4" stroke-dasharray="2 2"/></svg></div>
          <div class="hero-content"><h1>Beeral</h1><p>Menú Digital</p></div>
        </div>
        <div class="filtros"><button class="filtro-btn active" data-cat="todas">Todas</button><button class="filtro-btn" data-cat="Entradas">Entradas</button><button class="filtro-btn" data-cat="Platillos">Platillos</button><button class="filtro-btn" data-cat="Bebidas">Bebidas</button><button class="filtro-btn" data-cat="Postres">Postres</button></div>
        <div id="productos-grid" class="productos-grid"></div>
      </section>
      <section id="kitchen-view" class="view">
        <div class="section-header"><h2>Comandas</h2><span id="comandas-count" class="badge">0</span></div>
        <div id="comandas-list" class="comandas-list"></div>
      </section>
    </main>
    <div id="cart-fab" class="cart-fab hidden"><span class="cart-icon">&#128722;</span><span id="cart-count" class="cart-count">0</span></div>
    <div id="cart-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header"><h2>Tu Carrito</h2><button id="cart-close" class="close-btn">&times;</button></div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-total"><span>Total</span><span id="cart-total">$0</span></div>
        <button id="confirm-order" class="btn-primary">Confirmar Pedido</button>
      </div>
    </div>
  </div>

  <!-- Carga la lógica de n8n desde el archivo externo -->
  <script src="app_v2.js"></script>
</body>
</html>
